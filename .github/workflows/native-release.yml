name: Qualify and release portable DEB and CPU-native source RUN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and pinned Common dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev
      - name: Qualify portable Debian and embed exact source into native RUN
        run: |
          set -euo pipefail
          python3 -m py_compile standalone/build.py standalone/release.py
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          sudo python3 standalone/check-documentation-upgrade.py dist/*.deb
          test "$(find dist -name '*.deb' | wc -l)" = 1
          test "$(find dist -name '*.run' | wc -l)" = 1
      - name: Prove source-embedded RUN creates CPU-native Debian with one SO and PDF
        run: |
          set -euo pipefail
          FS_SO="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["module"])')"
          FS_REPO="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["repository"])')"
          FS_ABI="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["abi"])')"
          FS_PDF="$(python3 -c 'import json; print(json.load(open("standalone/config.json"))["pdf"])')"
          run_file="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          bash "$run_file" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb_file="$(find "$RUNNER_TEMP/native" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -s "$deb_file"
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-Native-Profile)" = aggressive
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-PGO)" = trained-two-pass
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-LTO)" = enabled
          test "$(dpkg-deb -f "$deb_file" X-Infiltrator-Source-Revision)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/installed"
          dpkg-deb -x "$deb_file" "$RUNNER_TEMP/installed"
          test "$(find "$RUNNER_TEMP/installed" -type f | wc -l)" = 2
          test -s "$RUNNER_TEMP/installed/System/Filesystems/$FS_SO"
          test -s "$RUNNER_TEMP/installed/System/Resources/Documentation/$FS_REPO.pdf"
          readelf -Ws "$RUNNER_TEMP/installed/System/Filesystems/$FS_SO" | grep -F "$FS_ABI"
      - name: Boot Linux through the exact packaged portable and native EXT4.so
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            cpio busybox-static e2fsprogs dosfstools gdisk mtools qemu-system-x86 ovmf
          work="$RUNNER_TEMP/ext4-package-boot"
          mkdir -p "$work"
          bash tests/fetch-production-boot.sh "$work/boot"
          validator=$(cat "$work/boot/validator.path")
          boot_efi=$(cat "$work/boot/efi.path")
          image=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ { image=$2 } END { print image }')
          test -n "$image"
          (cd "$work" && apt-get download "linux-image-unsigned-${image#linux-image-}")
          dpkg-deb -x "$work"/linux-image-unsigned-*.deb "$work/kernel"
          kernel="$work/kernel/boot/vmlinuz-${image#linux-image-}"
          dpkg-deb -x dist/*.deb "$work/portable"
          "$validator" "$work/portable/System/Filesystems/EXT4.so"
          "$validator" "$RUNNER_TEMP/installed/System/Filesystems/EXT4.so"
          bash tests/firmware-ext4.sh "$boot_efi" \
            "$work/portable/System/Filesystems/EXT4.so" "$kernel" "$work/portable-vm"
          bash tests/firmware-ext4.sh "$boot_efi" \
            "$RUNNER_TEMP/installed/System/Filesystems/EXT4.so" "$kernel" "$work/native-vm"
          bash tests/firmware-ext4.sh "$boot_efi" \
            "$RUNNER_TEMP/installed/System/Filesystems/EXT4.so" "$kernel" "$work/recovery-vm" needs-recovery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ext4-package-boot
          path: ${{ runner.temp }}/ext4-package-boot/*-vm/serial.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: native-filesystem-release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-filesystem-release
          path: dist
      - name: Publish immutable qualified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.ko' | wc -l)" = 0
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Existing immutable release $tag retained"
            exit 0
          fi
          gh release create "$tag" dist/*.deb dist/*.run --target "$GITHUB_SHA" \
            --title "Independent filesystem native and portable installers $version" \
            --notes "Portable DEB contains the Common V2 filesystem shared object and generated manual. The source-embedded RUN builds the SO and manual locally without installing or publishing a second filesystem-specific kernel driver. InfiltratorOS checks and repairs its outputs independently."
